# ============================================================
# ESPHome YAML – Message_Board (ESP32 + WS2812B, 30 LEDs)
# Board: ESP32 DevKit (ESP32-WROOM-32)
# LEDs: 3 columns x 10 rows = 30, serpentine
# Index 0 = top left (data input at LED0)
#
# MQTT:
#   stoermeldeboard/states  -> JSON array containing 30 tokens ["N","NP","A","AB","H",...]
#   stoermeldeboard/config  -> JSON object (colors/timing/layout); retained message recommended
# The Node-RED "setup string" is the central configuration.
# ESPHome defaults match this configuration.
# Timeout: 15 s -> all LEDs solid red (fallback A).
#
# Tokens:
#   N  = normal (LED off)
#   NP = normal_pulse (pulsing green)
#   A  = alarm (solid red)
#   AB = alarm_blink (blinking red)
#   H  = notice (pulsing blue)
#
# Boot-Test:
#   On startup: light each LED for 1 second in sequence, alternating red/green
#   Then switch to normal operation via MQTT
# ============================================================

esphome:
  name: esp32-messageboard
  friendly_name: ESP32 Messageboard
  on_boot:
    priority: -10
    then:
      - lambda: |-
          id(g_startup_test) = true;
          id(g_startup_start_ms) = millis();
          id(g_have_states) = false;
      - light.turn_on:
          id: strip
          effect: "Render"

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

api:
  reboot_timeout: 0s
  encryption:
    key: !secret esp32_messageboard__encryption_key

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2
  power_save_mode: none
  reboot_timeout: 0s

mqtt:
  broker: !secret mqtt_broker
  port: 1883
  username: !secret mqtt_username
  password: !secret mqtt_password
  discovery: false
  reboot_timeout: 0s
  clean_session: true
  keepalive: 15s

  on_message:
    # ----------------------------
    # STATES: JSON array containing 30 tokens
    # ----------------------------
    - topic: stoermeldeboard/states
      qos: 1
      then:
        - lambda: |-
            // Optional: log the raw payload
            ESP_LOGI("states", "RX raw: %s", x.c_str());

            JsonDocument doc;
            auto err = deserializeJson(doc, x);
            if (err) {
              ESP_LOGW("states", "JSON parse error: %s", err.c_str());
              return;
            }
            if (!doc.is<JsonArray>()) {
              ESP_LOGW("states", "Payload is not a JSON array");
              return;
            }

            JsonArray arr = doc.as<JsonArray>();
            const int maxn = std::min((int)arr.size(), 30);

            for (int i = 0; i < maxn; i++) {
              const char* tok = arr[i] | "N";
              uint8_t v = 0; // N
              if      (!strcmp(tok, "N"))  v = 0;
              else if (!strcmp(tok, "NP")) v = 1;
              else if (!strcmp(tok, "A"))  v = 2;
              else if (!strcmp(tok, "AB")) v = 3;
              else if (!strcmp(tok, "H"))  v = 4;
              id(g_states)[i] = v;
            }

            for (int i = maxn; i < 30; i++) id(g_states)[i] = id(g_fallback_token);

            id(g_last_states_ms) = millis();
            id(g_have_states) = true;

            ESP_LOGI("states", "Parsed OK, size=%d", (int)arr.size());

    # ----------------------------
    # CONFIG: global settings (colors/timing/layout)
    # ----------------------------
    - topic: stoermeldeboard/config
      qos: 1
      then:
        - lambda: |-
            JsonDocument doc;
            auto err = deserializeJson(doc, x);
            if (err) {
              ESP_LOGW("config", "JSON parse error: %s", err.c_str());
              return;
            }

            // Layout
            if (!doc["layout"]["cols"].isNull()) id(g_cols) = doc["layout"]["cols"].as<int>();
            if (!doc["layout"]["rows"].isNull()) id(g_rows) = doc["layout"]["rows"].as<int>();
            if (!doc["layout"]["serpentine"].isNull()) id(g_serpentine) = doc["layout"]["serpentine"].as<bool>();
            if (!doc["layout"]["major"].isNull()) {
              const char* major = doc["layout"]["major"] | "col";
              id(g_major_col) = !strcmp(major, "col");
            }

            // Global
            if (!doc["global"]["master_brightness"].isNull()) {
              float mb = doc["global"]["master_brightness"].as<float>(); // 0..255
              if (mb < 0) mb = 0;
              if (mb > 255) mb = 255;
              id(g_master_brightness) = mb / 255.0f;
            }
            if (!doc["global"]["timeout_ms"].isNull()) {
              int tmo = doc["global"]["timeout_ms"].as<int>();
              if (tmo < 0) tmo = 0;
              id(g_timeout_ms) = (uint32_t)tmo;
            }
            if (!doc["global"]["fallback_token"].isNull()) {
              const char* ft = doc["global"]["fallback_token"] | "A";
              uint8_t v = 2; // default A
              if      (!strcmp(ft, "N"))  v = 0;
              else if (!strcmp(ft, "NP")) v = 1;
              else if (!strcmp(ft, "A"))  v = 2;
              else if (!strcmp(ft, "AB")) v = 3;
              else if (!strcmp(ft, "H"))  v = 4;
              id(g_fallback_token) = v;
            }

            auto apply_token = [&](const char* key,
                                   int &r,int &g,int &b,int &mode,int &bri,
                                   int *pulse_ms,int *pulse_min,int *blink_ms,float *duty) {
              JsonVariant t = doc["tokens"][key];
              if (t.isNull()) return;

              if (t["rgb"].is<JsonArray>()) {
                r = t["rgb"][0] | r;
                g = t["rgb"][1] | g;
                b = t["rgb"][2] | b;
              }
              const char* m = t["mode"] | "";
              if (!strcmp(m, "static")) mode = 0;
              else if (!strcmp(m, "pulse")) mode = 1;
              else if (!strcmp(m, "blink")) mode = 2;

              if (!t["brightness"].isNull()) bri = t["brightness"].as<int>();

              if (pulse_ms && t["pulse_ms"]) *pulse_ms = t["pulse_ms"].as<int>();
              if (pulse_min && t["pulse_min"]) *pulse_min = t["pulse_min"].as<int>();
              if (blink_ms && t["blink_ms"]) *blink_ms = t["blink_ms"].as<int>();
              if (duty && t["duty"]) *duty = t["duty"].as<float>();
            };

            apply_token("N",  id(tN_r),  id(tN_g),  id(tN_b),  id(tN_mode),  id(tN_bri),
                        nullptr, nullptr, nullptr, nullptr);
            apply_token("NP", id(tNP_r), id(tNP_g), id(tNP_b), id(tNP_mode), id(tNP_bri),
                        &id(tNP_pulse_ms), &id(tNP_pulse_min), nullptr, nullptr);
            apply_token("A",  id(tA_r),  id(tA_g),  id(tA_b),  id(tA_mode),  id(tA_bri),
                        nullptr, nullptr, nullptr, nullptr);
            apply_token("AB", id(tAB_r), id(tAB_g), id(tAB_b), id(tAB_mode), id(tAB_bri),
                        nullptr, nullptr, &id(tAB_blink_ms), &id(tAB_duty));
            apply_token("H",  id(tH_r),  id(tH_g),  id(tH_b),  id(tH_mode),  id(tH_bri),
                        nullptr, nullptr, nullptr, nullptr);

            ESP_LOGI("config", "Config applied.");

globals:
  # ------- Startup LED Test -------
  - id: g_startup_test
    type: bool
    restore_value: no
    initial_value: 'true'

  - id: g_startup_start_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  # ------- States -------
  - id: g_states
    type: std::array<uint8_t, 30>
    restore_value: no
    initial_value: '{0}'

  - id: g_have_states
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: g_last_states_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  # ------- Timeout / Fallback -------
  - id: g_timeout_ms
    type: uint32_t
    restore_value: no
    initial_value: '15000'   # 15 s, configurable via MQTT

  - id: g_fallback_token
    type: uint8_t
    restore_value: no
    initial_value: '2'       # 2 = A (solid red)

  # ------- Layout -------
  - id: g_cols
    type: int
    restore_value: no
    initial_value: '3'
  - id: g_rows
    type: int
    restore_value: no
    initial_value: '10'
  - id: g_serpentine
    type: bool
    restore_value: no
    initial_value: 'true'
  - id: g_major_col
    type: bool
    restore_value: no
    initial_value: 'true'    # logical = col*rows + row

  # ------- Global Brightness -------
  - id: g_master_brightness
    type: float
    restore_value: no
    initial_value: '0.23529412'  # 60/255, Node-RED master_brightness: 60

  # ------- Token Styles (Mode: 0=static, 1=pulse, 2=blink) -------
  # N = off
  - id: tN_r
    type: int
    initial_value: '0'
  - id: tN_g
    type: int
    initial_value: '0'
  - id: tN_b
    type: int
    initial_value: '0'
  - id: tN_mode
    type: int
    initial_value: '0'
  - id: tN_bri
    type: int
    initial_value: '0'

  # NP
  - id: tNP_r
    type: int
    initial_value: '0'
  - id: tNP_g
    type: int
    initial_value: '255'
  - id: tNP_b
    type: int
    initial_value: '0'
  - id: tNP_mode
    type: int
    initial_value: '1'
  - id: tNP_bri
    type: int
    initial_value: '255'
  - id: tNP_pulse_ms
    type: int
    initial_value: '1400'
  - id: tNP_pulse_min
    type: int
    initial_value: '20'

  # A
  - id: tA_r
    type: int
    initial_value: '255'
  - id: tA_g
    type: int
    initial_value: '0'
  - id: tA_b
    type: int
    initial_value: '0'
  - id: tA_mode
    type: int
    initial_value: '0'
  - id: tA_bri
    type: int
    initial_value: '255'

  # AB
  - id: tAB_r
    type: int
    initial_value: '255'
  - id: tAB_g
    type: int
    initial_value: '0'
  - id: tAB_b
    type: int
    initial_value: '0'
  - id: tAB_mode
    type: int
    initial_value: '2'
  - id: tAB_bri
    type: int
    initial_value: '255'
  - id: tAB_blink_ms
    type: int
    initial_value: '250'
  - id: tAB_duty
    type: float
    initial_value: '0.5'

  # H = pulsing blue
  - id: tH_r
    type: int
    initial_value: '0'
  - id: tH_g
    type: int
    initial_value: '0'
  - id: tH_b
    type: int
    initial_value: '255'
  - id: tH_mode
    type: int
    initial_value: '1'
  - id: tH_bri
    type: int
    initial_value: '255'

light:
  - platform: esp32_rmt_led_strip
    id: strip
    internal: true
    channel_colors: GRB
    chipset: WS2812
    pin: GPIO18
    num_leds: 30
    restore_mode: ALWAYS_ON
    effects:
      - addressable_lambda:
          name: "Render"
          update_interval: 50ms
          lambda: |-
            const uint32_t now = millis();

            // 1) Startup Test
            if (id(g_startup_test)) {
              const uint32_t elapsed = now - id(g_startup_start_ms);
              const uint32_t step_ms = 1000;
              const uint32_t steps = 30;
              const uint32_t total_ms = steps * step_ms;

              if (elapsed < total_ms) {
                const int p = (int)(elapsed / step_ms);
                it.all() = Color(0, 0, 0);
                if ((p % 2) == 0) it[p] = Color(255, 0, 0);
                else              it[p] = Color(0, 255, 0);
                return;
              } else {
                id(g_startup_test) = false;
                it.all() = Color(0, 0, 0);
              }
            }

            // 2) Time base
            static uint32_t last = 0;
            static uint32_t t = 0;
            uint32_t dt = (last == 0) ? 0 : (now - last);
            last = now;
            t += dt;

            // 3) Timeout
            bool timeout = false;
            if (!id(g_have_states)) timeout = true;
            else if (id(g_timeout_ms) > 0 && (now - id(g_last_states_ms) > id(g_timeout_ms))) timeout = true;

            const int rows = id(g_rows);
            const int cols = id(g_cols);

            // logical -> physical (serpentine across columns)
            auto phys_index = [&](int logical) -> int {
              int col, row;
              if (id(g_major_col)) {
                col = logical / rows;
                row = logical % rows;
              } else {
                row = logical / cols;
                col = logical % cols;
              }
              if (id(g_serpentine) && (col % 2 == 1)) row = (rows - 1) - row;
              return col * rows + row;
            };

            auto get_style = [&](uint8_t token,
                                 int &r,int &g,int &b,int &mode,int &bri,
                                 int &pulse_ms,int &pulse_min,int &blink_ms,float &duty) {
              pulse_ms = 1400; pulse_min = 20; blink_ms = 500; duty = 0.5f;
              switch (token) {
                case 0: r=id(tN_r);  g=id(tN_g);  b=id(tN_b);  mode=id(tN_mode);  bri=id(tN_bri);  break;
                case 1: r=id(tNP_r); g=id(tNP_g); b=id(tNP_b); mode=id(tNP_mode); bri=id(tNP_bri);
                        pulse_ms=id(tNP_pulse_ms); pulse_min=id(tNP_pulse_min); break;
                case 2: r=id(tA_r);  g=id(tA_g);  b=id(tA_b);  mode=id(tA_mode);  bri=id(tA_bri);  break;
                case 3: r=id(tAB_r); g=id(tAB_g); b=id(tAB_b); mode=id(tAB_mode); bri=id(tAB_bri);
                        blink_ms=id(tAB_blink_ms); duty=id(tAB_duty); break;
                case 4: r=id(tH_r);  g=id(tH_g);  b=id(tH_b);  mode=id(tH_mode);  bri=id(tH_bri);  break;
                default:r=id(tN_r);  g=id(tN_g);  b=id(tN_b);  mode=id(tN_mode);  bri=id(tN_bri);  break;
              }
            };

            auto clamp255 = [&](float v) -> uint8_t {
              if (v < 0) v = 0;
              if (v > 255) v = 255;
              return (uint8_t)v;
            };

            for (int logical = 0; logical < 30; logical++) {
              const int p = phys_index(logical);
              uint8_t tok = timeout ? id(g_fallback_token) : id(g_states)[logical];

              int r,g,b,mode,bri,pulse_ms,pulse_min,blink_ms; float duty;
              get_style(tok, r,g,b,mode,bri,pulse_ms,pulse_min,blink_ms,duty);

              float level = 1.0f;

              if (mode == 1) { // pulse
                const uint32_t m = (pulse_ms <= 0) ? 1400 : (uint32_t)pulse_ms;
                uint32_t ph = (m == 0) ? 0 : (t % m);
                float x = (ph < m/2) ? (2.0f * ph / (float)m) : (2.0f - 2.0f * ph / (float)m);
                float minf = (float)pulse_min / 255.0f;
                float brif = (float)bri / 255.0f;
                level = minf + (brif - minf) * x;
              } else if (mode == 2) { // blink
                const uint32_t m = (blink_ms <= 0) ? 500 : (uint32_t)blink_ms;
                uint32_t ph = (m == 0) ? 0 : (t % m);
                float on = (ph < (uint32_t)(m * duty)) ? 1.0f : 0.0f;
                level = on * ((float)bri / 255.0f);
              } else {
                level = (float)bri / 255.0f;
              }

              level *= id(g_master_brightness);

              it[p] = Color(
                clamp255((float)r * level),
                clamp255((float)g * level),
                clamp255((float)b * level)
              );
            }

# ------------------------------------------------------------
# Example CONFIG (retained message recommended) sent to stoermeldeboard/config:
# {
#   "layout": { "cols": 3, "rows": 10, "serpentine": true, "major": "col" },
#   "global": { "master_brightness": 60, "timeout_ms": 15000, "fallback_token": "A" },
#   "tokens": {
#     "N":  { "rgb": [0,0,0],     "mode": "static", "brightness": 0 },
#     "NP": { "rgb": [0,255,0],   "mode": "pulse",  "brightness": 255, "pulse_ms": 1400, "pulse_min": 20 },
#     "A":  { "rgb": [255,0,0],   "mode": "static", "brightness": 255 },
#     "AB": { "rgb": [255,0,0],   "mode": "blink",  "brightness": 255, "blink_ms": 250, "duty": 0.5 },
#     "H":  { "rgb": [0,0,255],   "mode": "pulse",  "brightness": 255 }
#   }
# }
#
# Example STATES sent to stoermeldeboard/states:
# ["N","AB","N", ... 30 values ...]
# ------------------------------------------------------------